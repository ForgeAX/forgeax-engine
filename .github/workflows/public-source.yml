name: Public Engine Source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: public-source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup pinned npm
        run: |
          npm install --global "npm@$(cat .npm-version)" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$(cat .npm-version)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:engine
      - run: bun fx setup --dry-run
