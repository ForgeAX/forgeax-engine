<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>forgeax-engine - Distance fog</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #849bb7; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .fog-panel {
        position: fixed; left: 20px; top: 20px; z-index: 2; width: 248px;
        box-sizing: border-box; padding: 14px 16px; border: 1px solid rgba(220, 235, 250, .32);
        border-radius: 10px; color: #eaf4ff; background: rgba(15, 25, 40, .72);
        box-shadow: 0 8px 24px rgba(7, 14, 24, .18); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        backdrop-filter: blur(5px);
      }
      .fog-status { margin-bottom: 8px; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .04em; }
      .fog-hint { margin: 10px 0 12px; color: #c7d8e9; }
      .fog-actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .fog-button {
        border: 1px solid rgba(210, 230, 248, .35); border-radius: 6px; padding: 6px 9px;
        color: #eaf4ff; background: rgba(105, 135, 165, .35); cursor: pointer; font: inherit;
      }
      .fog-button:hover, .fog-button[aria-pressed="true"] { border-color: #9edcf0; background: #287e9b; }
      .fog-toggle { width: 100%; margin-bottom: 6px; background: rgba(205, 83, 45, .55); }
      .fog-keys { margin-top: 10px; color: #afc5d8; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <aside class="fog-panel" aria-label="Fog controls">
      <div class="fog-status" data-fog-status>FOG: HEIGHT</div>
      <button class="fog-button fog-toggle" data-fog-toggle type="button" aria-pressed="true">Fog On/Off</button>
      <div class="fog-actions" role="group" aria-label="Fog mode">
        <button class="fog-button" data-fog-phase="disabled" type="button" aria-pressed="false">Off</button>
        <button class="fog-button" data-fog-phase="uniform" type="button" aria-pressed="false">Uniform</button>
        <button class="fog-button" data-fog-phase="height" type="button" aria-pressed="true">Height</button>
      </div>
      <div class="fog-hint">同色门：10 / 30 / 60m · 同色球：低 / 高</div>
      <div class="fog-keys">键盘：F 开关 · 1 Off · 2 Uniform · 3 Height</div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
