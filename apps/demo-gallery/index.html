<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23182333'/%3E%3Cpath d='M6 8h8v16H6zm10 0h10v4H16v4h8v4h-8v4z' fill='%23ffb454'/%3E%3C/svg%3E"
    />
    <title>forgeax-engine demo gallery</title>
    <link rel="stylesheet" href="/src/gallery.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="sidebar-header">
          <h1>Demo Gallery</h1>
          <p id="demo-count"></p>
          <label class="search">
            <span class="sr-only">Filter demos</span>
            <input id="search" type="search" placeholder="Search demos..." autocomplete="off" />
          </label>
        </header>
        <nav id="nav" aria-label="Demo list"></nav>
      </aside>
      <main id="stage">
        <header id="stage-header">
          <div>
            <h2 id="demo-title">Pick a demo</h2>
            <p id="demo-meta"></p>
          </div>
          <a id="open-tab" href="#" target="_blank" rel="noopener noreferrer" hidden>Open in tab</a>
        </header>
        <div id="preview-wrap" hidden>
          <div id="preview-stage">
            <iframe id="preview-a" class="preview-frame" title="Demo preview"></iframe>
            <iframe id="preview-b" class="preview-frame is-idle" title="Demo preview"></iframe>
            <div id="preview-loading" hidden>
              <span class="preview-loading-label">Loading demo…</span>
            </div>
          </div>
        </div>
        <div id="placeholder">
          <p>Select a demo from the sidebar to preview it here.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
