<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forgeax-engine - Compressed Texture</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #texture-hud {
        position: fixed;
        top: 16px;
        left: 16px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.55);
        color: #e0e6f8;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #2a2f48;
        pointer-events: none;
        user-select: none;
      }
      #texture-recovery-state {
        position: fixed;
        right: 16px;
        top: 16px;
        max-width: 360px;
        margin: 0;
        padding: 8px 12px;
        color: #b9f6ca;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #2a4a38;
        border-radius: 6px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, monospace;
        white-space: pre-wrap;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="texture-hud">Backend: --  Mode: --</div>
    <pre id="texture-recovery-state">{"phase":"booting"}</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
