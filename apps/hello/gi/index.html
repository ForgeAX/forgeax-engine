<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>ForgeaX real-time GI</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #11151c;
        color: #d8dee9;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
      }
      #controls label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      canvas {
        max-width: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>Scene <select id="scene"></select></label>
      <label>GI <select id="gi"></select></label>
      <label><input type="checkbox" id="light" checked /> Light</label>
      <label><input type="checkbox" id="moved" /> Move light</label>
      <label><input type="checkbox" id="emissive" checked /> Emissive</label>
      <label><input type="checkbox" id="path" /> Camera path</label>
    </div>
    <canvas id="app" width="512" height="512"></canvas>
    <div id="status">Loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
