<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Nesting Demo</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #090b12; }
      #canvas { width: 100%; height: 100vh; display: block; }
      #scene-nesting-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: 520px;
        padding: 12px;
        color: #e9edf7;
        background: rgba(9, 11, 18, 0.86);
        border: 1px solid #39415c;
        border-radius: 6px;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #scene-nesting-panel button { margin-right: 8px; }
      #scene-nesting-report { white-space: pre-wrap; max-height: 180px; overflow: auto; }
    </style>
  </head>
  <body>
    <canvas id="canvas" style="width: 100%; height: 100vh; display: block;"></canvas>
    <section id="scene-nesting-panel" aria-label="Scene nesting diagnostic repair">
      <button id="scene-nesting-recover" type="button">Run unknown-field recovery</button>
      <button id="scene-nesting-cleanup" type="button" disabled>Cleanup</button>
      <pre id="scene-nesting-report" data-status="loading">loading</pre>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
