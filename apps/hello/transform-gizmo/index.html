<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ForgeaX Transform Gizmo</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1521;color:#dce4ef;font:14px system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:25px;letter-spacing:-.6px;margin:0 0 6px}p{margin:0;color:#8c9bb2}.tag{font:12px monospace;color:#64dbd2;border:1px solid #2d535a;padding:8px 12px;border-radius:20px}.tools{display:flex;gap:10px;align-items:center;padding:14px;background:#182334;border:1px solid #29364a;border-radius:12px 12px 0 0;flex-wrap:wrap}button,select{background:#223147;color:#dce4ef;border:1px solid #3b4c64;padding:9px 13px;border-radius:6px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#c9ece8;color:#153d44;border-color:#c9ece8}label{color:#aebdd0;margin-left:8px}input{accent-color:#73d7cf}canvas{width:100%;height:auto;display:block;touch-action:none;outline:none;background:#101a27}.stage{border:1px solid #29364a;border-top:0;overflow:hidden;border-radius:0 0 12px 12px}.footer{display:flex;justify-content:space-between;gap:20px;padding:17px 20px;background:#162131}#pose{white-space:pre;font:12px/1.7 monospace;color:#91a7bf}#hint{color:#b9c9dd;margin-bottom:5px}small{color:#7890ab}#reset{margin-left:auto}
