<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>forgeax-engine - learn-render section-5.advanced-lighting 3.2.point-shadows</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas#app { display: block; }
      #controls { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <nav id="controls" aria-label="Point shadow comparison">
      <button id="pause">Pause light (P)</button>
      <button id="reset">Reset light (R)</button>
      <button id="shadows">Shadows: on (Space)</button>
    </nav>
    <script>
      var app = document.getElementById('app');
      function resizeApp() {
        var dpr = window.devicePixelRatio || 1;
        var w = window.innerWidth;
        var h = window.innerHeight;
        app.width = Math.floor(w * dpr);
        app.height = Math.floor(h * dpr);
        app.style.width = w + 'px';
        app.style.height = h + 'px';
      }
      window.addEventListener('resize', resizeApp);
      resizeApp();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
