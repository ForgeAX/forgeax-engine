<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forgeax-engine - learn-render section-5.advanced-lighting 9.ssao</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas#app { display: block; }
      aside { position: fixed; left: 20px; top: 20px; padding: 18px; width: 220px; background: #172028e8; color: #fff; font: 14px/1.5 system-ui; border-radius: 8px; }
      aside strong, aside label, aside small { display: block; margin-bottom: 10px; }
      aside input[type=range] { width: 100%; }
      aside a { color: #9bd0ff; }
      aside nav { margin-bottom: 12px; }
      aside { max-height: calc(100vh - 76px); overflow-y: auto; max-width: calc(100vw - 76px); }
      aside small { color: #c3d0d9; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script>
      var app = document.getElementById('app');
      function resizeApp() {
        var dpr = window.devicePixelRatio || 1;
        var w = window.innerWidth;
        var h = window.innerHeight;
        app.width = Math.floor(w * dpr);
        app.height = Math.floor(h * dpr);
        app.style.width = w + 'px';
        app.style.height = h + 'px';
      }
      window.addEventListener('resize', resizeApp);
      resizeApp();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
