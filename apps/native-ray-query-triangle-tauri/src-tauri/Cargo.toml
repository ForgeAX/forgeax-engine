[package]
name = "forgeax-native-ray-query-triangle"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false
description = "Tauri consumer for the ForgeaX native wgpu Ray Query route proof."
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
forgeax-rhi-wgpu-native = { path = "../../../packages/rhi-wgpu-native" }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["unstable"] }
