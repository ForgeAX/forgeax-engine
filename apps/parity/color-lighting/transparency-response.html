<h1>透明、雾、离屏目标与输出顺序</h1>
<p>两层 HDR 透明片。Three.js 显式使用线性浮点 RenderTarget，再统一执行输出变换，与 Forgeax 原生流程对应。雾使用同一指数模型、按每层自己的相机距离求值。预乘模式的 Forgeax 材质输入显式乘透明度，Three 则设置 premultipliedAlpha。</p>
<p><select id="path"><option>forward</option><option>deferred</option></select><select id="blend"><option>straight</option><option>premultiplied</option></select><select id="tone"><option>linear</option><option>reinhard</option></select><label><input id="fog" type="checkbox">Fog</label> <label><input id="alpha" type="checkbox">透明画布</label></p>
