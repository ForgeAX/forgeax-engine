<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>WaterBody R0 · ForgeAX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#152526;color:#eff5ed;font:14px/1.5 system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}aside,.body-panel{position:absolute;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:12px;background:#122626ed;border:1px solid #d4ecd540;border-radius:6px}aside{left:16px;width:min(300px,calc(100vw - 32px))}.body-panel{right:16px;width:min(380px,calc(100vw - 32px))}h1{font-size:20px;line-height:1.2;margin:6px 0 8px}h2{font-size:15px;margin:0}p{color:#c4d6ce;margin:6px 0 10px}button{background:#deead8;color:#20352c;border:0;border-radius:4px;padding:6px 9px;cursor:pointer;margin:3px}#status{font-size:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.body-row{border-top:1px solid #ffffff2b;padding:8px 0}.body-row h3{display:inline;font-size:14px;margin:0 7px 0 0}.body-row button{font-size:11px;padding:4px 7px}.body-meta{font:10px/1.45 ui-monospace,monospace;color:#c1d4cb;overflow-wrap:anywhere}.kind-river{color:#38d6fa}.kind-lake{color:#ffd34e}.kind-ocean{color:#ff637c}.kind-custom{color:#9cf26f}.abi{font-size:11px;color:#efc77e}#toggle-panels{position:fixed;z-index:5;left:10px;bottom:10px;background:#deead8;border:0;border-radius:4px;padding:6px 9px}.panel-hidden #toggle-panels{width:38px;height:38px;padding:0;font-size:18px}.panel-hidden #toggle-panels::after{content:'☰'}.panel-hidden #toggle-panels{font-size:0}.panel-hidden #toggle-panels::after{font-size:18px}.panel-hidden aside,.panel-hidden .body-panel{display:none}@media(max-width:760px){aside{top:10px;left:10px;width:min(260px,calc(100vw - 20px));max-height:26vh;padding:9px}.body-panel{top:auto;left:10px;right:10px;bottom:48px;width:auto;max-height:44vh;padding:8px}.body-row{display:inline-block;vertical-align:top;width:49%;padding:6px 4px}.body-row:nth-of-type(even){border-left:1px solid #d4ecd52a}}
  </style>
</head>
<body data-water-demo="r0">
  <canvas id="water" aria-label="WaterBody 场景诊断视图"></canvas>
  <button id="toggle-panels" aria-label="隐藏面板" title="隐藏面板">隐藏面板</button>
  <aside>
    <small>FORGEAX · WATER R0</small>
    <h1>WaterBody 场景实例</h1>
    <p>显示四类 Body 的 Scene 实例边界与坐标轴。当前阶段不绘制水面。</p>
    <p id="status">正在加载场景...</p>
  </aside>
  <section class="body-panel" aria-label="WaterBody 场景实例">
    <header><h2>实例状态</h2><button id="bind-zone">挂载共享 Zone</button></header>
    <p class="abi">包围边界对应各 Body 的本地查询轮廓及世界变换。</p>
    <div id="body-actors"></div>
  </section>
  <script type="module" src="/src/water-demo.ts"></script>
</body>
</html>
