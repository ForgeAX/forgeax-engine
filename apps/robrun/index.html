<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RobRun / ForgeaX</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #e8eef5;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #0b0f14; z-index: 10; }
  #loading h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  #bar { width: 320px; height: 6px; background: #1d2733; border-radius: 3px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #f1c35a; transition: width .15s; }
  #stage { opacity: .7; }
  #hud { position: fixed; left: 10px; top: 10px; padding: 8px 10px; background: rgba(8, 12, 18, .55);
    border-radius: 6px; white-space: pre; font: 12px/1.45 Consolas, monospace; pointer-events: none; z-index: 2; }
  #help { position: fixed; right: 10px; top: 10px; padding: 8px 12px; background: rgba(8, 12, 18, .55);
    border-radius: 6px; pointer-events: none; z-index: 2; }
  #help b { color: #f1c35a; font-weight: 600; }
  #maps { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px;
    background: rgba(8, 12, 18, .7); border-radius: 6px; white-space: nowrap; z-index: 11; }
  #maps a { padding: 3px 12px; border-radius: 4px; color: inherit; text-decoration: none; opacity: .75; }
  #maps a:hover { opacity: 1; background: #1d2733; }
  #maps a.on { opacity: 1; background: #f1c35a; color: #0b0f14; font-weight: 600; }
  [hidden] { display: none !important; }
  .dim { opacity: .65; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0, 0, 0, .6); pointer-events: none; }
  #tip { position: fixed; left: 0; top: 0; padding: 2px 8px; background: rgba(8, 12, 18, .85); border-radius: 4px;
    white-space: nowrap; pointer-events: none; }
  #labels { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .district { position: absolute; left: 0; top: 0; font: 700 26px/1 Barlow, "Segoe UI", sans-serif; letter-spacing: 3px;
    color: #fff; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 4px #000, 0 2px 6px rgba(0, 0, 0, .8); }
  #filters { position: fixed; left: 10px; top: 150px; bottom: 10px; width: 250px; overflow-y: auto; padding: 8px 10px;
    background: rgba(8, 12, 18, .82); border-radius: 6px; user-select: none; z-index: 3; }
  #filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #filters em { margin-left: auto; font-style: normal; opacity: .6; }
  .f-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .f-head b { margin-right: auto; color: #f1c35a; }
  .f-head button { padding: 1px 6px; white-space: nowrap; font: inherit; color: inherit; background: #1d2733; border: 1px solid #33414f; border-radius: 4px; cursor: pointer; }
  .f-cat { margin-top: 8px; font-weight: 600; }
  .f-cat i { width: 10px; height: 10px; border-radius: 50%; }
  .f-sub { padding-left: 18px; }
  .f-sub img, .c-head img { width: 18px; height: 18px; padding: 2px; border-radius: 50%; object-fit: contain; }
  #card { position: fixed; right: 10px; bottom: 10px; width: 330px; max-height: 60vh; overflow-y: auto; padding: 10px 12px;
    background: rgba(8, 12, 18, .85); border-radius: 6px; z-index: 3; }
  #card p { margin: 6px 0; }
  .c-head { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .c-head img { width: 26px; height: 26px; }
  .kv { display: flex; gap: 10px; margin-top: 3px; }
  .kv .dim { flex: 0 0 84px; }
  .c-foot { margin-top: 8px; color: #f1c35a; }
  #err { position: fixed; left: 10px; bottom: 10px; right: 10px; color: #ff8a80; white-space: pre-wrap;
    font: 12px Consolas, monospace; pointer-events: none; }
</style>

</head>
<body>
<div id="loading"><h1>LOOTY BAY</h1><div id="bar"><i></i></div><div id="stage">Preparing...</div></div>
<nav id="maps"></nav>
<div id="hud"></div>
<div id="help"><b>ForgeaX native WebGPU</b><br>
Click: pointer lock / Mouse: look / Wheel: zoom<br>
WASD: move / Shift: sprint / Space: jump<br>
F: fly / C: descend / R: respawn / L: shadows<br>
M: filters / N: markers / T: teleport</div>
<div id="labels"></div>
<div id="cross" hidden></div>
<div id="tip" hidden></div>
<div id="filters" hidden></div>
<div id="card" hidden></div>
<div id="err"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
