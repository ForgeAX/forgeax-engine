<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9f0eb" />
  <link rel="icon" href="data:," />
  <title>水体几何 | ForgeAX</title>
</head>
<body>
  <canvas id="scene" aria-label="河流、湖泊、海洋和自定义水体三维场景"></canvas>
  <button id="panels" class="panel-toggle" type="button" aria-expanded="true" title="隐藏面板">面板</button>
  <aside class="inspector" aria-label="水体场景控制">
    <header>
      <div><span class="eyebrow">FORGEAX / 水系统</span><h1>水体几何</h1></div>
      <span id="render-state" class="render-state">正在启动</span>
    </header>
    <p class="summary">选择水体查看局部，切换可见性检查各自的几何与材质。</p>
    <section class="readout" aria-label="场景指标">
      <div><span>水体</span><strong id="body-count">—</strong></div>
      <div><span>可见网格</span><strong id="mesh-count">—</strong></div>
      <div><span>当前选择</span><strong id="focus-state">—</strong></div>
      <div><span>Pack</span><strong id="pack-state">—</strong></div>
      <div><span>已提交帧</span><strong id="frame-count">0</strong></div>
      <div><span>几何代次</span><strong id="geometry-state">—</strong></div>
      <div><span>查询与排除</span><strong id="query-state">—</strong></div>
    </section>
    <section class="segments">
      <h2>水体</h2>
      <ul id="body-list"></ul>
    </section>
    <section class="edit-controls" aria-label="选中水体编辑">
      <h2>几何重建</h2>
      <div id="product-switch" class="product-switch" role="group" aria-label="几何产品视图">
        <button type="button" data-product="visible" aria-pressed="true">可见水面</button>
        <button type="button" data-product="water-info" aria-pressed="false">未膨胀 WaterInfo</button>
        <button type="button" data-product="dilated" aria-pressed="false">膨胀 WaterInfo</button>
      </div>
      <label><span>水体基准高度</span><output id="height-value">0.00 m</output><input id="height-offset" type="range" min="-2" max="4" step="0.1" value="0" /></label>
      <label><span>形状膨胀</span><output id="dilation-value">40.96 m</output><input id="shape-dilation" type="range" min="0" max="80" step="0.1" value="40.96" /></label>
      <div class="spline-editor">
        <div class="spline-heading"><strong>样条控制点</strong><select id="spline-point" aria-label="选择样条控制点"></select></div>
        <div class="spline-actions"><button id="point-insert" type="button" title="插入控制点">插入</button><button id="point-copy" type="button" title="复制控制点">复制</button><button id="point-delete" type="button" title="删除控制点">删除</button></div>
        <div class="position-values">
          <label><span>X (m)</span><input id="point-x" type="number" step="0.1" /></label>
          <label><span>Y (m)</span><input id="point-y" type="number" step="0.1" /></label>
          <label><span>Z (m)</span><input id="point-z" type="number" step="0.1" /></label>
        </div>
        <div class="spline-values">
          <label><span>宽度</span><input id="point-width" type="number" min="0" step="0.1" /></label>
          <label><span>深度</span><input id="point-depth" type="number" min="0" step="0.1" /></label>
          <label><span>速度</span><input id="point-velocity" type="number" step="0.1" /></label>
          <label><span>音频强度</span><input id="point-audio" type="number" step="0.05" /></label>
        </div>
        <div class="scale-values" aria-label="场景缩放">
          <span>场景缩放</span>
          <label><span>X</span><input id="scale-x" type="number" min="0.1" max="4" step="0.1" /></label>
          <label><span>Y</span><input id="scale-y" type="number" min="0.1" max="4" step="0.1" /></label>
          <label><span>Z</span><input id="scale-z" type="number" min="0.1" max="4" step="0.1" /></label>
        </div>
      </div>
      <p id="body-note" hidden></p>
      <div class="actions"><button id="recook" class="command" type="button">重建所选水体</button><button id="exclusion" class="command" type="button" aria-pressed="false">添加排除盒</button></div>
    </section>
    <section class="physics-controls" aria-label="物理查询">
      <h2>物理</h2>
      <div class="readout compact-readout">
        <div><span>向下查询</span><strong id="raycast-state">等待</strong></div>
        <div><span>探针接触</span><strong id="contact-state">等待</strong></div>
        <div><span>碰撞体</span><strong id="collision-state">等待</strong></div>
      </div>
      <p id="physics-detail" class="physics-detail">等待 Physics 候选</p>
      <button id="raycast" class="command" type="button">向下射线查询</button>
    </section>
    <p id="status" class="status" role="status">正在加载水体资源…</p>
    <div class="actions"><button id="reset-view" class="command" type="button">重置视角</button><button id="show-all" class="command" type="button">显示全部</button></div>
  </aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
