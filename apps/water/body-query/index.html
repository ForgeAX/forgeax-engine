<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#e9f0eb" /><title>水体查询 | ForgeAX</title></head>
<body>
  <canvas id="scene" aria-label="实时水体与查询探针场景"></canvas>
  <main class="panel">
    <header><div><span class="eyebrow">FORGEAX / WATER R2</span><h1>水体查询</h1></div><span id="render-state" class="state">启动中</span></header>
    <section class="controls"><h2>查询位置</h2><label>目标水体<select id="body"><option value="lower">左侧湖泊 · 黄色标记 · Y 0 m</option><option value="upper">右侧海面 · 红色标记 · Y 4 m</option></select></label><label>水平位置<select id="point"><option value="inside">水体中心</option><option value="edge">向右 2 m</option></select></label><label>水面下方距离 <output id="probe-value">0.75 m</output><input id="probe-depth" type="range" min="0" max="5" step="0.05" value="0.75" /></label></section>
    <section class="trace"><h2>实时查询结果</h2><div class="metrics values"><div><span>水面高度</span><strong id="surface-height">—</strong></div><div><span>水深</span><strong id="water-depth">—</strong></div><div><span>浸没深度</span><strong id="immersion">—</strong></div><div><span>结果来源</span><strong id="source">—</strong></div><div><span>查询位置</span><strong id="query-position">—</strong></div><div><span>水体代次</span><strong id="generation">—</strong></div></div></section>
    <details class="advanced"><summary>查询选项与完整字段</summary><div class="flags" role="group" aria-label="查询字段"><label><input type="checkbox" data-flag="location" checked />位置</label><label><input type="checkbox" data-flag="normal" checked />法线</label><label><input type="checkbox" data-flag="depth" checked />水深</label><label><input type="checkbox" data-flag="immersion" checked />浸没深度</label><label><input type="checkbox" data-flag="velocity" />流速</label><label><input type="checkbox" data-flag="waves" checked />包含波浪</label><label><input type="checkbox" data-flag="simple" />简化波浪</label><label><input type="checkbox" data-flag="ignore" />忽略排除区</label></div>
    <section class="switches"><label><input id="terrain-toggle" type="checkbox" checked />地形提供者</label><label><input id="exclusion-toggle" type="checkbox" />排除区</label><label><input id="baked-toggle" type="checkbox" />预烘焙查询网格</label></section>
    <div class="metrics values"><div><span>水体资源</span><strong id="body-guid">—</strong></div><div><span>地形采样</span><strong id="provider">—</strong></div><div><span>请求标志</span><strong id="requested">—</strong></div><div><span>调整后标志</span><strong id="adjusted">—</strong></div><div><span>位置 / 水面</span><strong id="location">—</strong></div><div><span>法线 / 水深</span><strong id="normal">—</strong></div><div><span>浸没 / 流速</span><strong id="motion">—</strong></div><div><span>可读字段</span><strong id="valid">—</strong></div></div><code id="trace">等待首个水体查询</code></details>
    <p id="status" role="status">正在加载场景资源</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
