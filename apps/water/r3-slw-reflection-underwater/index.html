<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水域 · 反射与水下</title>
  </head>
  <body>
    <div id="app">
      <header><a class="brand" href="#">FORGEAX <span>水域</span></a><div class="scene-title">反射与水下 <span>R3</span></div><div id="render-state" role="status">准备场景</div><button id="panel-toggle" class="icon-button" type="button" aria-label="收起面板" aria-controls="controls-panel" aria-expanded="true" title="收起面板"><span aria-hidden="true">&#x203A;</span></button></header>
      <main>
        <div class="viewport"><canvas id="scene" tabindex="0" aria-label="水域三维场景"></canvas><div class="scene-caption"><span class="dot"></span><span id="camera-label">湖畔 · 全景</span><span id="frame-count">0 帧</span><span id="fps" aria-label="完成帧率">-- FPS</span></div></div>
        <aside id="controls-panel" aria-label="水域观察面板">
          <div class="panel-heading"><h1>水域观察</h1><span id="view-medium">水面以上</span></div>
          <section><h2>场景与水体</h2><label class="field-label" for="scenario">场景</label><select id="scenario"><option value="baseline">光学基准</option><option value="river-lake">河流与湖泊</option><option value="river-ocean">河流与海洋</option><option value="shared">双湖泊</option></select><div class="segmented" aria-label="水体类型"><button type="button" data-body="lake" aria-pressed="true">湖泊</button><button type="button" data-body="river" aria-pressed="false">河流</button><button type="button" data-body="ocean" aria-pressed="false">海洋</button><button type="button" data-body="custom" aria-pressed="false">自定义</button></div><label id="body-instance-field" class="field-label" hidden>湖泊实例<select id="body-instance"><option value="primary">西侧湖泊</option><option value="peer">东侧湖泊</option></select></label><label class="toggle"><span>水面可见</span><input id="body-visible" type="checkbox" checked /></label><label class="toggle"><span>水体网格</span><input id="water-mesh" type="checkbox" checked /></label><label class="toggle"><span>远处海平面</span><input id="far-mesh" type="checkbox" /></label></section>
          <section><h2>视角</h2><div class="view-grid"><button type="button" data-view="overview" aria-pressed="true">全景</button><button type="button" data-view="surface" aria-pressed="false">水面</button><button type="button" data-view="waterline" aria-pressed="false">水线</button><button type="button" data-view="underwater" aria-pressed="false">水下</button></div><label class="range-label" for="height">相机高度 <output id="height-value">10.00 m</output></label><input id="height" type="range" min="-4" max="30" step="0.02" value="10" /></section>
          <section><h2>材质</h2><fieldset id="material-controls"><label class="field-label" for="water-appearance">水体外观</label><select id="water-appearance"><option value="native">原生默认</option><option value="clear">清澈</option><option value="custom" disabled>自定义材质</option></select><label class="field-label" for="material-slot">当前槽位</label><select id="material-slot"><option value="surface">水面</option><option value="lod">远景</option><option value="info">水体信息</option><option value="underwater">水下</option><option value="lakeTransition">河流 → 湖泊</option><option value="oceanTransition">河流 → 海洋</option><option value="far">海平面远景</option></select><div class="asset-summary"><strong id="material-name"></strong><span id="material-guid"></span><span id="material-requested"></span></div><label class="field-label" for="material-choice">候选材质</label><select id="material-choice"></select><div class="command-grid"><button type="button" id="bind-material">绑定资产</button><button type="button" id="replace-material">替换内容</button><button type="button" id="independent-material">独立实例</button><button type="button" id="restore-material">恢复内容</button></div><dl><div><dt>关联水体</dt><dd id="material-consumers">0</dd></div><div><dt>资产操作</dt><dd id="material-action" role="status">就绪</dd></div><div><dt>场景槽位</dt><dd id="material-admission" role="status">待接纳</dd></div><div><dt>材质内容</dt><dd id="material-verification">待 GPU 核验</dd></div></dl>
            <label class="field-label">吸收 / m</label><div class="vector-inputs"><label>R<input id="absorption-r" data-material-value="absorption" data-lane="0" type="number" min="0" step="0.001" /></label><label>G<input id="absorption-g" data-material-value="absorption" data-lane="1" type="number" min="0" step="0.001" /></label><label>B<input id="absorption-b" data-material-value="absorption" data-lane="2" type="number" min="0" step="0.001" /></label></div>
            <label class="field-label">散射 / m</label><div class="vector-inputs"><label>R<input id="scattering-r" data-material-value="scattering" data-lane="0" type="number" min="0" step="0.001" /></label><label>G<input id="scattering-g" data-material-value="scattering" data-lane="1" type="number" min="0" step="0.001" /></label><label>B<input id="scattering-b" data-material-value="scattering" data-lane="2" type="number" min="0" step="0.001" /></label></div>
            <label class="range-label" for="roughness">粗糙度 <output for="roughness"></output></label><input id="roughness" data-material-value="roughness" type="range" min="0" max="1" step="0.01" />
            <label class="range-label" for="normal">法线强度 <output for="normal"></output></label><input id="normal" data-material-value="normal" type="range" min="0" max="2" step="0.01" />
            <label class="range-label" for="refraction-strength">近处折射 <output for="refraction-strength"></output></label><input id="refraction-strength" data-material-value="refractionPixelNormalStrength" type="range" min="0.8" max="1.3" step="0.001" />
            <label class="range-label" for="distant-refraction-strength">远处折射 <output for="distant-refraction-strength"></output></label><input id="distant-refraction-strength" data-material-value="distantRefractionPixelNormalStrength" type="range" min="0.8" max="1.3" step="0.001" />
            <label class="range-label" for="bottom-refraction">水下折射量 <output for="bottom-refraction"></output></label><input id="bottom-refraction" data-material-value="refractionBottomAmount" type="range" min="0" max="1" step="0.01" />
            <label class="range-label" for="lip-refraction">水线折射 <output for="lip-refraction"></output></label><input id="lip-refraction" data-material-value="lipRefraction" type="range" min="0.8" max="1.3" step="0.001" />
            <label class="range-label" for="refraction-depth-bias">折射深度偏移 <output for="refraction-depth-bias"></output></label><input id="refraction-depth-bias" data-material-value="refractionDepthBias" type="range" min="0" max="1" step="0.01" />
            <label class="range-label" for="critical-angle">临界角阈值 <output for="critical-angle"></output></label><input id="critical-angle" data-material-value="criticalAngleDot" type="range" min="0" max="1" step="0.005" />
            <label class="range-label" for="phase">相位各向异性 <output for="phase"></output></label><input id="phase" data-material-value="phase" type="range" min="-0.99" max="0.99" step="0.01" />
            <label class="field-label" for="normal-texture">法线纹理</label><select id="normal-texture"><option value="normal">水面</option><option value="river-normal">河流</option></select>
            <label class="toggle"><span>纹理法线</span><input data-material-switch="waterNormalTexture" type="checkbox" /></label><label class="toggle"><span>波浪形变</span><input data-material-switch="waterWaves" type="checkbox" /></label><label class="toggle"><span>烘焙流场</span><input data-material-switch="waterBakedSimulation" type="checkbox" /></label>
          </fieldset></section>
          <section><h2>水下选择</h2><label class="range-label" for="priority">水体优先级</label><input id="priority" type="number" min="-10" max="10" step="1" /><label class="field-label" for="collision-group">碰撞组</label><select id="collision-group"><option value="65537">组 1</option><option value="131074">组 2</option></select><label class="field-label" for="trace-group">查询组</label><select id="trace-group"><option value="65537">组 1</option><option value="131074">组 2</option></select><label class="toggle"><span>相机处排除体积</span><input id="exclusion" type="checkbox" /></label><label class="toggle"><span>烘焙数据</span><input id="baked-data" type="checkbox" /></label><dl><div><dt>场景水体</dt><dd id="selection-admission">待接纳</dd></div></dl><output id="selection-action" role="status"></output></section>
          <section><h2>渲染</h2><label class="toggle"><span>屏幕空间反射</span><input id="ssr" type="checkbox" checked /></label><label class="field-label" for="water-ssr-temporal">水面反射时域</label><select id="water-ssr-temporal"><option value="always">独立时域</option><option value="auto">自动</option><option value="off">关闭</option></select><label class="toggle"><span>时间抗锯齿</span><input id="taa" type="checkbox" checked /></label><label class="toggle"><span>后处理</span><input id="post-processing" type="checkbox" checked /></label><label class="toggle"><span>内部解析度 67%</span><input id="scale" type="checkbox" /></label><label class="toggle"><span>场景动画</span><input id="motion" type="checkbox" checked /></label><button type="button" id="recover-renderer" class="wide-command" disabled>恢复渲染器</button></section>
          <section class="readouts"><h2>当前视图</h2><dl><div><dt>浸没深度</dt><dd id="immersion">0.00 m</dd></div><div><dt>水下后处理</dt><dd id="post-process">待处理</dd></div><div><dt>音频边沿</dt><dd id="audio-state">水面以上</dd></div><div><dt>CPU 已接纳瓦片</dt><dd id="tile-count">0</dd></div><div><dt>最近完成帧</dt><dd id="completed-receipt">待完成</dd></div></dl></section>
          <footer id="status">加载水体与材质</footer>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
