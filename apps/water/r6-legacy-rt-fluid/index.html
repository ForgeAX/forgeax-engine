<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>局部流体 · Water R6</title></head>
<body>
  <header><div class="brand"><span class="brand-mark">F</span><strong>局部流体</strong><span class="version">WATER R6</span></div><div class="frame-status"><span id="live-dot"></span><span id="status">加载场景</span><span id="fps">-- FPS</span></div><button id="panel-toggle" aria-expanded="true">参数</button></header>
  <main>
    <section class="viewport"><canvas id="scene" tabindex="0"></canvas><div class="view-toolbar"><div class="segmented" aria-label="相机"><button data-view="overview" aria-pressed="true">全景</button><button data-view="ripple" aria-pressed="false">左池</button><button data-view="shallow" aria-pressed="false">右池</button><button data-view="top" aria-pressed="false">俯视</button></div><button id="capture">捕获帧</button></div><div class="basin-tags"><span><i class="ripple-color"></i>左池 <b id="left-mode">涟漪</b></span><span><i class="shallow-color"></i>右池 <b id="right-mode">浅水</b></span></div><div class="scene-bottom"><span id="action-state">等待 GPU</span><span id="frame-receipt">--</span></div></section>
    <aside id="controls-panel">
      <section><div class="section-heading"><h2>模拟</h2><label class="check"><input id="enabled" type="checkbox" checked>启用</label></div><label class="row">目标<select id="basin"><option value="ripple">左池</option><option value="shallow">右池</option><option value="both" selected>双池</option></select></label><label class="row">求解器<select id="solver"><option value="original">默认对照</option><option value="ripple">涟漪 Ripple</option><option value="shallow">浅水 Shallow</option></select></label><label class="row">地形<select id="terrain"><option value="original">默认对照</option><option value="constant-depth">恒定水深</option><option value="water-info">WaterInfo</option></select></label><label class="row">分辨率<select id="quality"><option value="128">128 × 128</option><option value="256">256 × 256</option><option value="512">512 × 512</option></select></label><div class="checks"><label class="check"><input id="foam" type="checkbox" checked>动态泡沫</label><label class="check"><input id="grid" type="checkbox" checked>网格边界</label></div></section>
      <section><div class="section-heading"><h2>注入</h2><span class="unit">世界坐标 · m</span></div><label class="range-label">高度增量 <output id="height-value">-0.25 m</output><input id="height" type="range" min="-2" max="2" step="0.01" value="-0.25"></label><label class="range-label">半径 <output id="radius-value">1.20 m</output><input id="radius" type="range" min="0.2" max="2.5" step="0.01" value="1.2"></label><label class="range-label">泡沫强度 <output id="foam-value">1.0</output><input id="foam-force" type="range" min="0" max="4" step="0.1" value="1"></label><div class="numeric-pair"><label>X 位置<input id="force-x" type="number" min="-10" max="10" step="0.5" value="-5"></label><label>Z 位置<input id="force-z" type="number" min="-7" max="7" step="0.5" value="0"></label></div><div class="button-row"><button id="impulse" class="primary">注入冲击</button><button id="pulse">三点脉冲</button></div><div class="checks"><label class="check"><input id="moving" type="checkbox">持续移动注入</label><label class="check"><input id="follow" type="checkbox">网格跟随</label></div></section>
      <section><div class="section-heading"><h2>时序与视图</h2><label class="check"><input id="paused" type="checkbox">暂停</label></div><div class="button-row"><button id="step">前进一帧</button><button id="reset">重置模拟</button></div><div class="checks"><label class="check"><input id="multi-view" type="checkbox">第二视图</label><label class="check"><input id="compact" type="checkbox">紧凑画布</label></div><button id="recover" class="wide" disabled>恢复设备</button></section>
      <section class="diagnostics"><div class="section-heading"><h2>当前提交</h2><button id="export" class="text-button">导出</button></div><dl><div><dt>完成帧</dt><dd id="completed">0</dd></div><div><dt>模拟步</dt><dd id="steps">--</dd></div><div><dt>代次</dt><dd id="generation">--</dd></div><div><dt>队列</dt><dd id="queue">--</dd></div><div><dt>CPU 水高</dt><dd id="cpu-height">--</dd></div><div><dt>共享生产</dt><dd id="producer">--</dd></div></dl><pre id="roles">等待提交</pre><div id="errors" role="status"></div></section>
      <section class="wave-settings"><div class="section-heading"><h2>波峰泡沫</h2><label class="check"><input id="wave-follow" type="checkbox">独立移动</label></div><label class="row">配方<select id="wave-preset"><option value="calm">平静水面</option><option value="crests">波峰泡沫</option></select></label><label class="row">分辨率<select id="wave-quality"><option value="64">64 × 64</option><option value="128" selected>128 × 128</option><option value="256">256 × 256</option><option value="512">512 × 512</option></select></label><label class="row">覆盖范围<input id="wave-extent" class="extent-input" type="number" min="4" max="80" step="1" value="24" aria-label="泡沫覆盖范围（米）"></label><div class="numeric-pair"><label>中心 X 偏移 · m<input id="wave-x" type="number" min="-32" max="32" step="0.5" value="0"></label><label>中心 Z 偏移 · m<input id="wave-z" type="number" min="-32" max="32" step="0.5" value="0"></label></div></section>
    </aside>
  </main><script type="module" src="/src/main.ts"></script>
</body></html>
