<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#e9f0eb" /><title>Gerstner 波浪 | ForgeAX</title></head>
<body>
  <canvas id="scene" aria-label="实时 Gerstner 波浪场景"></canvas>
  <main class="panel">
    <header><div><span class="eyebrow">FORGEAX / WATER R2</span><h1>Gerstner 波浪</h1></div><span id="render-state" class="state">启动中</span></header>
    <section class="controls"><h2>水面波浪</h2><label>波浪强度 <output id="strength-value">1.0 ×</output><input id="strength" type="range" min="0.4" max="1.8" step="0.1" value="1" /></label><label>查询水深 <output id="depth-value">2.0 m</output><input id="depth" type="range" min="0" max="12" step="0.1" value="2" /></label><div class="segmented" role="group" aria-label="CPU 波浪求值"><button type="button" data-mode="full" aria-pressed="true">完整计算</button><button type="button" data-mode="simple" aria-pressed="false">简化计算</button></div></section>
    <section class="metrics query"><div><span>水面高度</span><strong id="surface">—</strong></div><div><span>波高</span><strong id="wave-height">—</strong></div><div><span>深度衰减</span><strong id="attenuation">—</strong></div><div><span>波面法线</span><strong id="normal">—</strong></div></section>
    <section class="metrics"><div><span>GPU 水面</span><strong id="gpu-state">等待中</strong></div><div><span>波数 / 种子</span><strong id="wave-count">— / 731</strong></div><div><span>引擎时间</span><strong id="time-readout">0.000 s</strong></div><div><span>已提交帧</span><strong id="frame-count">0</strong></div><div><span>水体代次</span><strong id="generation">—</strong></div></section>
    <section class="trace"><h2>引擎查询</h2><code id="trace">等待水体与区域接入</code></section>
    <p id="status" role="status">正在加载场景资源</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
