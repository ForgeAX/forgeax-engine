[package]
name = "dimforge_rapier3d" # Can't be named rapier3d which conflicts with the dependency.
version = "0.20.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
description = "3-dimensional physics engine in Rust - official JS bindings."
documentation = "https://rapier.rs/rustdoc/rapier3d/index.html"
homepage = "https://rapier.rs"
repository = "https://github.com/dimforge/rapier"
readme = "README.md"
keywords = ["physics", "dynamics", "rigid", "real-time", "joints"]
license = "Apache-2.0"
edition = "2018"

[features]
default = ["dim3"]
dim3 = []

[lib]
name = "rapier_wasm3d"
path = "../../src/lib.rs"
crate-type = ["cdylib", "rlib"]
required-features = ["dim3"]

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2"))',
] }

[dependencies]
# `rapier{2,3}d` is patched to the in-repo crate (see the workspace
# `[patch.crates-io]` in ../../Cargo.toml); this version requirement must stay
# semver-compatible with that crate's version for the patch to take effect.
rapier3d = { version = "0.35.0", features = [
    "serde-serialize",
    "debug-render",
    "profiler",
    
] }
# The explicit dependency to parry only needed to pin the version; it must match
# the version (and math-backend feature set) the in-repo rapier crate depends on.
parry3d = { version = "0.30.2", default-features = false, features = [
    "required-features",
] }
ref-cast = "1"
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
nalgebra = "0.35"
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
palette = "0.7"

[package.metadata.wasm-pack.profile.release]
# add -g to keep debug symbols
wasm-opt = [
    '-O4',
    '--dce',
    # The two options below are needed because of: https://github.com/rustwasm/wasm-pack/issues/1501
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    
]
#wasm-opt = ['-g']
