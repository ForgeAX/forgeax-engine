[package]
name = "forgeax-render-kernel-napi"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Opt-in Node-API (napi-rs) binding for ForgeAX RenderKernel native wgpu 30 dedicated OS render thread."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forgeax-render-kernel-wgpu = { path = "../kernel-wgpu" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", path = "../../../../../third_party/wgpu/wgpu", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", path = "../../../../../third_party/wgpu/wgpu", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", path = "../../../../../third_party/wgpu/wgpu", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", path = "../../../../../third_party/wgpu/wgpu", default-features = false, features = ["vulkan"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
# Keep linker layout intact on macOS dyld (matches rhi-wgpu-native/node).
strip = "none"
