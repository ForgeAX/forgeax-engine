packages:
  - "packages/*"
  - "apps/*"
  - "apps/showcase/*"
  - "apps/hello/*"
  - "apps/perf/*"
  - "apps/bevy/*"
  - "apps/shadertoy/*"
  - "apps/parity/*"
  - "apps/learn-render/*/*"
  - "apps/learn-render/*/*/*"
  - "tools/view"
  - "tools/forgeax-mcp"
  - "tools/view/packages/*"
  - "templates/empty"
  - "templates/game-3d"

allowBuilds:
  core-js-pure: false
  esbuild: true
  simple-git-hooks: true
  webgpu: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

linkWorkspacePackages: true
shellEmulator: true
minimumReleaseAgeExclude:
  - "@forgeax/*"
patchedDependencies:
  '@deepseek-ai/cordis@4.0.4': patches/@deepseek-ai__cordis@4.0.4.patch

overrides:
  body-parser: "^2.4.0"
  fast-uri: "^3.1.9"
  zod: "^4.6.7"
