packages:
  - "packages/*"
  - "apps/*"
  - "apps/showcase/*"
  - "apps/hello/*"
  - "apps/perf/*"
  - "apps/bevy/*"
  - "apps/shadertoy/*"
  - "apps/parity/*"
  - "apps/learn-render/*/*"
  - "apps/learn-render/*/*/*"
  - "tools/view"
  - "tools/forgeax-mcp"
  - "tools/view/packages/*"
  - "templates/empty"
  - "templates/game-3d"

allowBuilds:
  core-js-pure: false
  esbuild: true
  simple-git-hooks: true
  webgpu: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

linkWorkspacePackages: true
shellEmulator: true
minimumReleaseAgeExclude:
  - "@forgeax/*"
patchedDependencies:
  '@actions/glob@0.7.0': patches/@actions__glob@0.7.0.patch
  '@deepseek-ai/cordis@4.0.4': patches/@deepseek-ai__cordis@4.0.4-native-service-read.patch
  vitest@4.1.12: patches/vitest@4.1.12.patch

overrides:
  "@hono/node-server": "2.1.3"
  body-parser: "^2.4.0"
  fast-uri: "^3.1.9"
  follow-redirects: "^1.16.2"
  glob: "^14.0.2"
  joi: "^18.3.1"
  minimatch: "^11.0.1"
  qs: "^6.16.1"
  zod: "^4.6.7"
